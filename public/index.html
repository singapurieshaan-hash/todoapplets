<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Applet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Todo Applet</h1>

        <button id="logout-btn" type="button">
            Log Out
        </button>

        <form id="todo-form">

            <input
                id="task-input"
                type="text"
                placeholder="Enter a task"
            >

            <button type="submit">
                Add
            </button>

        </form>

        <ul id="todo-list"></ul>

        <footer class="footer">
          <p>&copy; 2026 Todo Applet. All rights reserved.</p>
          <p class="footer-tagline">Stay organized. Get things done.</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
